name: build
on:
  workflow_call:              # only runs when another workflow calls it
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release
      id-token: write          # signing identity
      attestations: write      # store the attestation
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/hello-service
            dist/hello-service.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hello-service dist/hello-service.tar.gz --title "$GITHUB_REF_NAME"
