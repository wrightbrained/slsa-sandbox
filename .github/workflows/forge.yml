name: forge
on:
  workflow_dispatch:          # manual only: never runs on a tag
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh
      - name: Compromised dependency (LAB 6.1 stand-in)
        run: |
          printf '#!/bin/sh\necho "LAB 6.1 SUBSTITUTE, NOT A REAL BUILD"\n' > dist/hello-service
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/hello-service
            dist/hello-service.tar.gz
      - name: Keep the substitute as a workflow artifact (never a release)
        uses: actions/upload-artifact@v4
        with:
          name: substitute
          path: dist/hello-service
      - name: Create release
        if: false                 # rule 3: this copy can never publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hello-service dist/hello-service.tar.gz --title "$GITHUB_REF_NAME"
