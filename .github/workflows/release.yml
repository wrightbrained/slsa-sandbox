name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write            # create the release
  id-token: write            # let the job get a signing identity from GitHub
  attestations: write        # store the attestation on GitHub
  artifact-metadata: write   # recommended by the actions/attest README
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh    # produces ./dist/hello-service
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/hello-service
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hello-service dist/hello-service.tar.gz --title "$GITHUB_REF_NAME"
