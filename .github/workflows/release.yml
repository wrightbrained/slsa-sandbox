name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write          # needed to create the release; new repos default to read-only
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh    # produces ./dist/hello-service
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hello-service --title "$GITHUB_REF_NAME"
