name: release
on:
  push:
    tags: ['v*']
jobs:
  release:
    permissions:               # the caller must grant what build.yml needs
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build.yml
  verify:
    needs: release             # runs after the build, against what was published
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/verify.yml
    with:
      tag: ${{ github.ref_name }}
  vsa:
    needs: verify              # only issue a VSA for a release that passed the gate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/vsa.yml
    with:
      tag: ${{ github.ref_name }}
